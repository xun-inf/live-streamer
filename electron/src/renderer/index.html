<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:"
    />
    <title>LIVE Streamer</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="titlebar">
      <div class="titlebar-left">
        <svg class="titlebar-logo" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="10" fill="#2b6cf6" />
          <path d="M9 7.5c3.6 1.6 3.6 7.4 0 9M15 7.5c-3.6 1.6-3.6 7.4 0 9" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" />
        </svg>
        <span class="app-name">LIVE Streamer</span>
        <span class="app-version" id="app-version"></span>
        <span class="conn-dot" id="conn-dot" title="连接中…"></span>
      </div>
      <div class="titlebar-right">
        <span class="user-id">ID:1000149572</span>
        <span class="titlebar-divider"></span>
        <button class="win-btn" id="btn-minimize" title="最小化">
          <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6h8" stroke="currentColor" stroke-width="1.2" /></svg>
        </button>
        <button class="win-btn" id="btn-maximize" title="最大化">
          <svg viewBox="0 0 12 12" aria-hidden="true"><rect x="2.5" y="2.5" width="7" height="7" fill="none" stroke="currentColor" stroke-width="1.2" /></svg>
        </button>
        <button class="win-btn win-btn-close" id="btn-close" title="关闭">
          <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M3 3l6 6M9 3l-6 6" stroke="currentColor" stroke-width="1.2" /></svg>
        </button>
      </div>
    </header>

    <div class="workspace">
      <aside class="col col-left">
        <section class="panel panel-scenes">
          <div class="tabs">
            <button class="tab active">场景1</button>
            <button class="tab">场景2</button>
          </div>
          <div class="scene-list">
            <div class="scene-item">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.4" /><path d="M8 16l6-8 2 2-6 8z" fill="currentColor" /></svg>
              <span>OBS Virtual Camera</span>
            </div>
          </div>
          <div class="scene-actions">
            <button class="add-material" id="btn-add-material">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6v12M6 12h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" /></svg>
              <span>添加素材</span>
            </button>
            <button class="icon-btn" id="btn-clear-material" title="清空素材">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" /></svg>
            </button>
          </div>
        </section>

        <section class="panel panel-tools">
          <h3>常用功能</h3>
          <div class="tool-grid">
            <button class="tool">
              <span class="tool-icon tool-pk">PK</span>
              <span class="tool-label">PK</span>
            </button>
            <button class="tool">
              <span class="tool-icon tool-sticker">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h14v10l-4 4H5z" fill="none" stroke="#fff" stroke-width="1.5" stroke-linejoin="round" /><path d="M15 19v-4h4" fill="none" stroke="#fff" stroke-width="1.5" /></svg>
              </span>
              <span class="tool-label">贴纸</span>
            </button>
          </div>
        </section>
      </aside>

      <main class="col col-stage">
        <section class="title-card">
          <div class="avatar">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="9" r="4" fill="currentColor" /><path d="M4 21c0-4 4-6 8-6s8 2 8 6" fill="currentColor" /></svg>
          </div>
          <div class="title-block">
            <div class="title-row">
              <span
                class="title-text"
                id="room-title"
                contenteditable="true"
                spellcheck="false"
                data-placeholder="请在这里编辑标题"
              ></span>
              <svg class="icon-pencil" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L20 8l-4-4L4 16z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" /></svg>
            </div>
            <div class="title-meta">
              <span class="meta-item">
                <svg class="meta-icon gem" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h12l3 5-9 11L3 9z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" /></svg>
                <span id="gem-count">0</span>
              </span>
              <span class="meta-item">
                <svg class="meta-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6z" fill="none" stroke="currentColor" stroke-width="1.5" /><circle cx="12" cy="12" r="2.4" fill="currentColor" /></svg>
                <span id="viewer-count">0</span>
              </span>
            </div>
          </div>
        </section>

        <section class="preview">
          <!-- 验证多窗口：两个并列区域，各对应 engine 侧一个本地窗口（id 1 / 2） -->
          <div class="video-frame">
            <div class="video-host" id="video-host-1" data-window-id="1">
              <svg class="stage-logo" viewBox="0 0 120 160" aria-hidden="true">
                <ellipse cx="60" cy="80" rx="33" ry="50" fill="none" stroke="#ffffff" stroke-width="5" />
                <path d="M44 48c26 14 26 50 0 64" fill="none" stroke="#ffffff" stroke-width="5" />
                <path d="M76 48c-26 14-26 50 0 64" fill="none" stroke="#ffffff" stroke-width="5" />
              </svg>
            </div>
            <div class="video-host" id="video-host-2" data-window-id="2">
              <svg class="stage-logo" viewBox="0 0 120 160" aria-hidden="true">
                <ellipse cx="60" cy="80" rx="33" ry="50" fill="none" stroke="#ffffff" stroke-width="5" />
                <path d="M44 48c26 14 26 50 0 64" fill="none" stroke="#ffffff" stroke-width="5" />
                <path d="M76 48c-26 14-26 50 0 64" fill="none" stroke="#ffffff" stroke-width="5" />
              </svg>
            </div>
          </div>
        </section>

        <section class="toolbar">
          <div class="device-group">
            <svg class="device-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" fill="none" stroke="currentColor" stroke-width="1.5" /><path d="M5 11a7 7 0 0014 0M12 18v3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" /></svg>
            <input type="range" min="0" max="100" value="50" id="mic-volume" aria-label="麦克风音量" />
            <span class="device-value" id="mic-value">50%</span>
          </div>
          <div class="device-group">
            <svg class="device-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" /><path d="M16 9a4 4 0 010 6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" /></svg>
            <input type="range" min="0" max="100" value="50" id="speaker-volume" aria-label="扬声器音量" />
            <span class="device-value" id="speaker-value">50%</span>
          </div>
          <span class="toolbar-divider"></span>
          <button class="icon-btn" id="btn-audio-settings" title="音频设置">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" /><path d="M17 9l4 6M21 9l-4 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" /></svg>
          </button>
          <button class="icon-btn" id="btn-notifications" title="通知">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 17h12l-1.5-2v-4a4.5 4.5 0 00-9 0v4z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" /><path d="M10 20a2 2 0 004 0" fill="none" stroke="currentColor" stroke-width="1.5" /></svg>
          </button>
          <button class="icon-btn" id="btn-settings" title="设置">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.5" /><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" /></svg>
          </button>
          <div class="toolbar-spacer"></div>
          <button class="btn btn-ghost" id="btn-back">返回</button>
          <button class="btn btn-primary" id="btn-live">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="12" height="10" rx="3" fill="none" stroke="currentColor" stroke-width="1.6" /><path d="M15 12l6-3.5v7z" fill="currentColor" /></svg>
            <span id="btn-live-text">开始直播</span>
          </button>
        </section>
      </main>

      <aside class="col col-right">
        <section class="panel panel-audience">
          <div class="panel-header">
            <div class="tabs">
              <button class="tab active">在线观众</button>
              <button class="tab">贡献榜</button>
            </div>
            <button class="icon-btn" title="展开">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5h10v10M19 5l-9 9M5 9v10h10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></svg>
            </button>
          </div>
          <div class="panel-body empty-hint" id="audience-body">展示本场在线观众</div>
        </section>

        <section class="panel panel-interact">
          <div class="panel-header">
            <h3>直播间互动</h3>
            <div class="panel-header-actions">
              <button class="icon-btn" title="互动设置">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.5" /><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" /></svg>
              </button>
              <button class="icon-btn" title="展开">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5h10v10M19 5l-9 9M5 9v10h10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></svg>
              </button>
            </div>
          </div>
          <div class="interact-body">
            <div class="interact-block empty-hint" id="gift-body">展示本场礼物消息</div>
            <div class="interact-block empty-hint" id="comment-body">展示本场评论互动消息</div>
          </div>
        </section>
      </aside>
    </div>

    <script src="renderer.js"></script>
  </body>
</html>
